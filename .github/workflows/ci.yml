name: Verify Lotline
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Verify production runtime dependencies
        run: npm ci --prefix server --omit=dev --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: lotline-firebase-build
          path: |
            dist/firebase
            dist/server
          retention-days: 7
